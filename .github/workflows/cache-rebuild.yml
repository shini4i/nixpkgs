name: Cache Rebuild

on:
  schedule:
    - cron: '0 2 * * 0'  # Weekly on Sunday at 2 AM UTC
  push:
    branches: [main]
    paths:
      - 'pkgs/**'
      - 'flake.nix'
      - 'flake.lock'
  workflow_dispatch:

permissions:
  contents: read

env:
  CACHIX_CACHE_NAME: shini4i

jobs:
  list-packages:
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.list.outputs.packages }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - id: list
        run: |
          if [[ ! -d pkgs ]]; then
            echo "packages=[]" >> $GITHUB_OUTPUT
            exit 0
          fi

          PACKAGES=$(ls -d pkgs/*/ 2>/dev/null | xargs -n1 basename | jq -R -s -c 'split("\n") | map(select(length > 0))') || PACKAGES="[]"

          if [[ -z "$PACKAGES" || "$PACKAGES" == "[]" ]]; then
            echo "packages=[]" >> $GITHUB_OUTPUT
          else
            echo "packages=$PACKAGES" >> $GITHUB_OUTPUT
          fi

  build-cache:
    needs: list-packages
    if: needs.list-packages.outputs.packages != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJson(needs.list-packages.outputs.packages) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: ${{ env.CACHIX_CACHE_NAME }}
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Check cache and build if needed
        env:
          CACHE_URL: https://${{ env.CACHIX_CACHE_NAME }}.cachix.org
        run: |
          PACKAGE="${{ matrix.package }}"

          # Validate package name contains only safe characters
          if [[ ! "$PACKAGE" =~ ^[a-zA-Z0-9_-]+$ ]]; then
            echo "::error::Invalid package name: $PACKAGE"
            exit 1
          fi

          echo "Checking if $PACKAGE is already in cache..."

          # Get the store path for this package
          if ! STORE_PATH=$(nix eval --raw ".#${PACKAGE}.outPath" 2>&1); then
            echo "::error::Failed to evaluate store path for $PACKAGE: $STORE_PATH"
            exit 1
          fi

          # Extract just the hash (e.g., /nix/store/abc123-name-1.0 -> abc123)
          STORE_NAME="${STORE_PATH##*/}"
          STORE_HASH="${STORE_NAME%%-*}"

          # Check if the narinfo exists in Cachix
          HTTP_STATUS=$(curl -s --connect-timeout 10 --max-time 30 -o /dev/null -w "%{http_code}" "${CACHE_URL}/${STORE_HASH}.narinfo")

          if [[ "$HTTP_STATUS" == "200" ]]; then
            echo "Package $PACKAGE already in cache, skipping build"
          else
            echo "Package $PACKAGE not in cache (HTTP $HTTP_STATUS), building..."
            nix build ".#${PACKAGE}"
            echo "Built $PACKAGE (cachix-action handles the push)"
          fi
